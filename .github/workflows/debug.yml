name: Build Kivy Android APK In Debug Mode

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java-home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            curl unzip openjdk-17-jdk libltdl-dev

    - name: Install Buildozer and python-for-android
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy
        pip install python-for-android

    - name: Patch p4a to fix pip self-upgrade crash
      run: |
        # 获取 p4a 安装路径
        P4A_DIR=$(python -c "import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))")
        echo "p4a installed at: $P4A_DIR"
        
        # 把 p4a 里的 "pip install -U pip" 替换成空操作，避免 pip 自升级把自己搞坏
        if [ -f "$P4A_DIR/build.py" ]; then
          sed -i 's/pip install -U pip/pip install --upgrade "pip<25" || true/g' "$P4A_DIR/build.py"
          echo "Patched build.py successfully"
        else
          echo "WARNING: build.py not found at $P4A_DIR"
        fi
        
        # 把 p4a 路径写入 buildozer.spec，让 buildozer 使用系统安装的 p4a 而不是自己下载
        echo "" >> buildozer.spec
        echo "p4a.source_dir = $P4A_DIR" >> buildozer.spec
        echo "Added p4a.source_dir to buildozer.spec"
        tail -5 buildozer.spec

    - name: Build APK with Buildozer
      run: |
        set -e
        export PATH="$HOME/.local/bin:$PATH"
        java -version
        python --version
        buildozer --version
        
        export BUILDOZER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0
        
        buildozer -v android debug 2>&1 | tee buildozer.log
        
        echo "===== Searching for apk files ====="
        find . -type f -name "*.apk"

    - name: Check if APK exists
      id: check-build
      run: |
        APK_FILES=$(find . -name "*.apk")
        if [ -n "$APK_FILES" ]; then
          echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT
          echo "Found APK:"
          echo "$APK_FILES"
        else
          echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_OUTPUT
          echo "No APK found."
          exit 1
        fi

    - name: Upload APK artifact
      if: steps.check-build.outputs.BUILD_FINAL_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kivy-app-apk
        path: |
          .buildozer/android/platform/build/dists/**/*.apk
          bin/*.apk
          *.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          buildozer.log
        retention-days: 7
